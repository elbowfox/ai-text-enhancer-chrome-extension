<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Text Enhancer</title>
  <style>
    body { width: 380px; padding: 16px; font-family: system-ui, sans-serif; font-size: 14px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    #result { white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 8px; max-height: 300px; overflow-y: auto; min-height: 60px; }
    button { margin-top: 10px; padding: 8px 14px; border: none; border-radius: 6px; background: #1a73e8; color: white; cursor: pointer; }
    button:hover { background: #1557b0; }
    .status { color: #666; font-size: 12px; margin-bottom: 8px; }
    .copy { background: #34a853; }
  </style>
</head>
<body>
  <h2>AI Text Enhancer</h2>
  <div class="status" id="status">Select text on a page and right-click to enhance.</div>
  <div id="result"></div>
  <button id="copy" class="copy" style="display:none;">Copy Result</button>
  <button id="options">Settings / API Key</button>
  <script src="popup.js"></script>
</body>
</html>
